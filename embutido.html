<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC 202 CSS em embutido</title>
    <style>
        em {
            color: orange;
        }
        code{
            color: lime;
            text-decoration: underline;
            font-family: sans-serif;
        }
        dt > code {
            color: white;
            background-color: black;
        }
         
    </style>
</head>
<body>
    <main>
        <h1>DCC 202 CSS embutido</h1>
        <p>Você pode aplicar um estilo <em> em linha</em> para um elemento usando o elemento <code>style no head</code>.</p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Alterna a cor do elemento.</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de fundo do elemento</dd>
            </div>
        </dl>
    </main>

</body>

</html>
